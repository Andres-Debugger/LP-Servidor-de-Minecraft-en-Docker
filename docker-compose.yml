version: '3.8'

services:
  minecraft:
    image: itzg/minecraft-server
    container_name: minecraft_server
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      MEMORY: "5G"
      TYPE: "VANILLA"
      ONLINE_MODE: "FALSE"
      MOTD: "LP's Minecraft Server"
    volumes:
      - ./data:/data
    restart: unless-stopped